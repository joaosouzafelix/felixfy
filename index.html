<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pobrefy - Sua Música</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== APLICATIVO PRINCIPAL ===== -->
    <div id="app">
        <div class="app-container">
            <!-- ===== MENU LATERAL ===== -->
            <aside>
                <div class="logo">🎵 Pobrefy</div>

                <nav>
                    <ul>
                        <li class="active" data-page="home">🏠 Início</li>
                        <li data-page="search">🔍 Buscar</li>
                        <li data-page="library">📚 Sua Biblioteca</li>
                    </ul>
                </nav>

                <div class="playlist-section">
                    <h3>Playlists</h3>
                    <ul id="sidebarPlaylists">
                        <li data-playlist="ana-castela">🎤 Ana Castela</li>
                        <li data-playlist="sertanejo">🎸 Sertanejo</li>
                        <li data-playlist="funk">🎧 Funk</li>
                        <li class="create-playlist-btn">➕ Criar playlist</li>
                    </ul>
                </div>

                <div class="user-info">
                    <span id="userNameDisplay">Usuário</span>
                </div>
            </aside>

            <!-- ===== CONTEÚDO PRINCIPAL ===== -->
            <main id="mainContent">
                <!-- Página Inicial -->
                <div id="page-home" class="page-content active">
                    <header>
                        <h1 class="greeting" id="greetingMessage">Boa tarde!</h1>
                        <p class="greeting-sub">O que você quer ouvir hoje?</p>
                    </header>

                    <section>
                        <h2 class="section-title">Suas playlists</h2>
                        <div class="playlist-grid" id="homePlaylists">
                            <!-- Playlists serão inseridas pelo JavaScript -->
                        </div>
                    </section>
                </div>

                <!-- Página de Busca -->
                <div id="page-search" class="page-content">
                    <header>
                        <h1 class="section-title">Buscar músicas</h1>
                    </header>

                    <div class="search-container">
                        <div class="search-bar">
                            <
